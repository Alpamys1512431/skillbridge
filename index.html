      '<div class="flow pf"><div class="node"><b>Browser request</b><span>http://10.0.2.15</span></div><span class="arrow" aria-hidden="true">→</span><div class="node"><b>Linux + Nginx</b><span>Active service · TCP 80</span></div><span class="arrow" aria-hidden="true">→</span><div class="node"><b>index.html</b><span>“Hello, SkillBridge!”</span></div></div>'+
      '<div class="row between"><h3>Saved deliverables</h3><span class="small muted">3 of 3 included</span></div><div class="stack" style="gap:12px">'+dl+'</div>'+
      '<div class="row between" style="border-top:1px solid var(--line);padding-top:14px"><span class="small muted">Submission SB-1042 · Reviewed 10 October 2026 at 09:10</span><a class="btn ghost" href="#submitted">View submission →</a></div></section>':

  var VIEWS={dashboard:vDash,brief:vBrief,lab:vLab,review:vReview,submitted:vSubmitted,feedback:vFeedback,skills:vSkills,'learning-path':vPath,progress:vProgress,portfolio:vPortfolio,about:vAbout};

  function topbar(r){
    var i=ORDER.indexOf(r),root=document.documentElement;
    var dark=root.getAttribute('data-theme')==='dark'||(!root.getAttribute('data-theme')&&window.matchMedia('(prefers-color-scheme: dark)').matches);
    $top.innerHTML='<div class="crumb"><b>'+CRUMB[r]+'</b></div><div class="tools">'+(i>=0?'<span>Step '+(i+1)+' of 6</span>':'')+'<span class="badge">Demo data</span><button class="tbtn" type="button" data-action="theme" aria-pressed="'+dark+'">'+(dark?'Light theme':'Dark theme')+'</button></div>';
  }
  function render(focus){
    var r=state.route;
    topbar(r);
    $view.innerHTML=VIEWS[r]();
    var nav={dashboard:'dashboard',brief:'projects',lab:'projects',review:'projects',submitted:'projects',feedback:'projects',skills:'skills','learning-path':'learning-path',progress:'progress',portfolio:'portfolio',about:'about'}[r];
    document.querySelectorAll('[data-nav]').forEach(function(a){if(a.getAttribute('data-nav')===nav)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
    if(focus){var h=$view.querySelector('h1');if(h){h.focus({preventScroll:true});window.scrollTo(0,0)}}
  }
  function enter(n){
    if(n==='dashboard')log('dashboard_opened');
    if(n==='brief')log('brief_opened');
    if(n==='lab')log('lab_started');
    if(n==='feedback'){log('feedback_opened');state.passed=true}
    if(n==='skills')log('skills_opened');
    if(n==='learning-path')log('learning_path_opened');
    if(n==='progress')log('progress_opened');
    if(n==='portfolio')log('portfolio_opened');
  }
  function onHash(){
    var h=(location.hash||'#dashboard').slice(1),n=ROUTES.indexOf(h)>=0?h:'dashboard';
    if(n!==state.route){enter(n);state.route=n;render(true)}
  }
  function go(r){if(location.hash==='#'+r)onHash();else location.hash=r}

  document.addEventListener('change',function(e){
    if(e.target.id==='sec'){state.secrets=e.target.checked;document.getElementById('cmp').disabled=!labReady()}
    if(e.target.id==='cf'){state.confirm=e.target.checked;document.getElementById('cs').disabled=!state.confirm}
  });
  document.addEventListener('click',function(e){
    var t=e.target.closest('[data-action]');if(!t)return;
    var a=t.getAttribute('data-action');
    if(a==='theme'){var root=document.documentElement,dark=root.getAttribute('data-theme')==='dark'||(!root.getAttribute('data-theme')&&window.matchMedia('(prefers-color-scheme: dark)').matches);root.setAttribute('data-theme',dark?'light':'dark');render(false)}
    else if(a==='skip'){var h=$view.querySelector('h1');if(h)h.focus()}
    else if(a==='complete'){if(!labReady())return;state.labDone=true;log('lab_completed');go('review')}
    else if(a==='confirm'){if(!state.confirm)return;state.submitted=true;log('submission_confirmed');go('submitted')}
    else if(a==='feedback'){go('feedback')}
    else if(a==='runcheck'){var id=t.getAttribute('data-id');if(!state.checks[id]){state.checks[id]=true;log('command_run');render(false);var nx=$view.querySelector('[data-action="runcheck"]')||document.getElementById('sec');if(nx)nx.focus({preventScroll:true})}}
    else if(a==='clearlog'){state.log=[];render(false)}
  });
  window.addEventListener('hashchange',onHash);
  onHash();
})();
